<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walentynki</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background: #ffe6e6;
        overflow: hidden;
        font-family: 'Pacifico', cursive;
        position: relative;
    }

    h1 {
        font-size: 3em;
        text-align: center;
        margin-bottom: 20px;
        color: #ff3366;
    }

    img {
        width: 300px;
        margin-bottom: 20px;
        text-align: center;
    }

    .buttons {
        display: flex;
        gap: 20px;
        margin-top: 20px;
    }

    button {
        padding: 15px 30px;
        font-size: 1.5em;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.3s;
        background-color: #ff3366;
        color: white;
    }

    .hearts {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
    }

    .heart {
        position: absolute;
        width: 30px;
        height: 30px;
        background-color: red;
        transform: rotate(-45deg);
        animation: fall 4s linear infinite;
    }

    .heart::before,
    .heart::after {
        content: "";
        position: absolute;
        width: 30px;
        height: 30px;
        background-color: red;
        border-radius: 50%;
    }

    .heart::before {
        top: -15px;
        left: 0;
    }

    .heart::after {
        top: 0;
        left: 15px;
    }

    @keyframes fall {
        0% { transform: translateY(-50px) rotate(-45deg); opacity: 1;}
        100% { transform: translateY(100vh) rotate(-45deg); opacity: 0;}
    }

    .hidden {
        display: none;
    }
</style>
</head>
<body>

<h1>Czy zostaniesz moją walentynką?</h1>
<img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3MzeXFjeDQ0dDlpNjc4cW5ub2lmOXBibXJ4dW5laHhiNGNrczFhdCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/zZbf6UpZslp3nvFjIR/giphy.gif" alt="Kot w butach">

<div class="buttons">
    <button id="yesBtn">Tak</button>
    <button id="noBtn">Nie</button>
</div>

<div class="hearts" id="heartsContainer"></div>

<div id="finalMessage" class="hidden">
    <h1>Wiedziałem że się zgodzisz &lt;3</h1>
    <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExbmpoYXhsamx5NTUzOG51ZmVhZmNqcWcwdG5ubnB5ajczenRhMzB3OCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ytu2GUYbvhz7zShGwS/giphy.gif" alt="Kot daje buziaka">
</div>

<script>
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const heartsContainer = document.getElementById('heartsContainer');
const finalMessage = document.getElementById('finalMessage');

noBtn.addEventListener('click', () => {
    // Powiększ przycisk Tak o 20%
    const currentScale = yesBtn.style.transform.replace(/[^0-9.]/g, '') || 1;
    const newScale = parseFloat(currentScale) + 0.2;
    yesBtn.style.transform = `scale(${newScale})`;
});

yesBtn.addEventListener('click', () => {
    // Pokaż wiadomość końcową
    document.querySelector('h1').classList.add('hidden');
    document.querySelector('img').classList.add('hidden');
    document.querySelector('.buttons').classList.add('hidden');
    finalMessage.classList.remove('hidden');

    // Dodaj spadające serca
    for(let i = 0; i < 50; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (2 + Math.random() * 3) + 's';
        heart.style.width = heart.style.height = (20 + Math.random() * 20) + 'px';
        heartsContainer.appendChild(heart);
    }
});
</script>

</body>
</html>
